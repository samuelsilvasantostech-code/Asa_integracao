<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClinFy: início</title>
<link rel="stylesheet" href="styles.css?v=0.46.0">
</head>
<body class="page-dash">
<div class="app">
  <header class="hd">
    <div class="hd__brand">
      <span class="hd__logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg></span>
      <div>
        <h1 class="hd__title">ClinFy<span class="hd__sis" data-sis="marca"></span></h1>
        <div class="hd__sub" id="in-dia">Hoje na clínica</div>
      </div>
    </div>
    <button class="btn" id="in-refresh" type="button">Atualizar</button>
    <span class="pill" id="pill" data-tone="idle"><i class="dot"></i><span id="pill-text">Carregando</span></span>
  </header>

  <main class="dash">
    <p class="muted" id="in-status" role="status">Carregando a agenda de hoje…</p>

    <section class="kpis kpis--hero" id="in-kpis" aria-label="Resumo de hoje" hidden></section>

    <div class="dash__grid">
      <section class="panel panel--wide" aria-labelledby="h-prox">
        <header class="panel__hd">
          <h2 class="panel__title" id="h-prox">Próximos pacientes</h2>
          <p class="panel__sub">Consultas de hoje que ainda não chegaram, em ordem de horário. Quem já chegou aparece na Agenda, na sala de espera.</p>
        </header>
        <ul class="todo" id="in-prox"></ul>
      </section>

      <section class="panel" aria-labelledby="h-atalhos">
        <header class="panel__hd">
          <h2 class="panel__title" id="h-atalhos">Atalhos</h2>
        </header>
        <form class="lookup lookup--block" id="in-q-form" autocomplete="off" role="search">
          <label class="sr" for="in-q">Buscar paciente por CPF ou telefone</label>
          <input id="in-q" inputmode="numeric" maxlength="18" placeholder="Buscar paciente: CPF ou telefone">
          <button class="btn btn--primary" type="submit">Buscar</button>
        </form>
        <p class="muted shortcuts__msg" id="in-q-msg" role="status"></p>
        <div class="shortcuts" id="in-atalhos">
          <button class="btn" type="button" data-aba="agenda">Abrir a Agenda</button>
          <button class="btn" type="button" data-aba="painel">Abrir o Painel</button>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="core.js?v=0.46.0"></script>
<script src="api.js?v=0.46.0"></script>
<script src="bridge.js?v=0.46.0"></script>
<script src="inicio.js?v=0.46.0"></script>
</body>
</html>
